name: Manter Supabase Ativo

on:
  schedule:
    # Corre a cada 3 dias às 04:17 UTC (fora das horas de ponta do GitHub)
    - cron: '17 4 */3 * *'
  workflow_dispatch: # Permite testar manualmente no GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Fazer pedido HTTP à API do Supabase
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/version" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
